<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar participación | Innovation Hub</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#contenido">
    Saltar al contenido
  </a>

  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary"
         aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
          Innovation Hub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">
                Mis iniciativas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="formulario.html">
                Publicar iniciativa
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="perfil.html">
                Perfil
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="contenido" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <a href="../index.html">← Volver a iniciativas</a>
        <h1 class="mt-3">Solicitar participación</h1>

        <p id="iniciativaDestino" class="lead"></p>

        <div id="estadoSolicitud"
             role="status"
             aria-live="polite">
          Cargando iniciativa…
        </div>

        <!-- Permanece oculto hasta verificar la iniciativa y sus permisos. -->
        <form id="formularioSolicitud" novalidate hidden>
          <div class="mb-3">
            <label for="mensaje" class="form-label">
              Mensaje de presentación *
            </label>
            <textarea id="mensaje"
                      name="mensaje"
                      rows="5"
                      maxlength="500"
                      class="form-control"
                      aria-describedby="error-mensaje"></textarea>
            <div id="error-mensaje" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="competencia" class="form-label">
              Competencia principal que aportas *
            </label>
            <select id="competencia"
                    name="competencia"
                    class="form-select"
                    aria-describedby="error-competencia">
              <option value="">Selecciona una competencia</option>
            </select>
            <div id="error-competencia" class="invalid-feedback"></div>
          </div>

          <div class="row g-3">
            <div class="col-12 col-md-6 mb-3">
              <label for="rol" class="form-label">
                Rol deseado *
              </label>
              <select id="rol"
                      name="rol"
                      class="form-select"
                      aria-describedby="error-rol">
                <option value="">Selecciona un rol</option>
                <option value="colaborador">Colaborador</option>
                <option value="coordinador">Coordinador</option>
              </select>
              <div id="error-rol" class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-6 mb-3">
              <label for="disponibilidad" class="form-label">
                Disponibilidad semanal *
              </label>
              <select id="disponibilidad"
                      name="disponibilidad"
                      class="form-select"
                      aria-describedby="error-disponibilidad">
                <option value="">Selecciona tu disponibilidad</option>
                <option value="2-4 horas">2 a 4 horas</option>
                <option value="5-8 horas">5 a 8 horas</option>
                <option value="9+ horas">9 horas o más</option>
              </select>
              <div id="error-disponibilidad"
                   class="invalid-feedback"></div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            Enviar solicitud
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="container py-4 border-top">
    <small>Innovation Hub · Prototipo Avance 1</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/participar.js"></script>
</body>
</html>
